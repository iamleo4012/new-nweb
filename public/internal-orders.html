<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Store Orders | AL-NASSIM</title>
<!-- INTERNAL staff page: view + print customer orders. Page access is gated
     by middleware (staff JWT); data comes from /api/admin/orders which
     enforces requireStaff() server-side. Read-only by design — order
     processing stays in the existing Admin panel. -->
<style>
  :root { --ink:#1a2332; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .topbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#0f172a; color:#fff; padding:12px 24px; }
  .topbar .brand { font-weight:800; letter-spacing:.08em; }
  .topbar .sub { color:#94a3b8; font-size:13px; }
  .topbar .spacer { flex:1; }
  .topbar a { color:#cbd5e1; font-size:13px; text-decoration:none; }
  .topbar a:hover { color:#fff; }
  main { max-width:1100px; margin:24px auto 60px; padding:0 16px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .controls select, .controls input[type="search"] {
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13.5px; color:var(--ink);
  }
  .btn { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; }
  .btn:hover { background:#f8fafc; }
  .btn.primary { background:#0f766e; border-color:#0f766e; color:#fff; }
  .btn.primary:hover { background:#115e59; }
  .error-box { display:none; margin:0 0 14px; padding:10px 14px; border:1px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:8px; font-size:13.5px; }
  table.orders { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  table.orders th, table.orders td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top; }
  table.orders th { background:#f8fafc; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  table.orders tbody tr:hover { background:#f8fafc; cursor:pointer; }
  table.orders .num { font-weight:700; white-space:nowrap; }
  table.orders .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .section-title { font-size:18px; font-weight:800; margin:0 0 14px; letter-spacing:.02em; }
  .view-btn { white-space:nowrap; }
  .pager { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); background:#fff; border-radius:10px; }
  .detail-actions { display:flex; gap:8px; margin-bottom:14px; }
  /* WhatsApp button — sits next to the customer's phone number (list row and
     detail sheet). Opens wa.me with a pre-filled bilingual message; the staff
     member still presses Send inside WhatsApp. */
  .wa-btn { display:inline-block; margin-inline-start:8px; padding:3px 10px; background:#25d366; color:#fff; border:0; border-radius:6px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; vertical-align:middle; font-family:inherit; }
  .wa-btn:hover { background:#1fb857; }
  @media (max-width:640px) { .wa-btn { margin-top:4px; } }
  /* ===== Horizontal day tabs + single list container ====================== */
  .day-tabs { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; margin-bottom:14px; }
  .day-tab { flex:1 1 0; min-width:0; padding:10px 8px; text-align:center; background:#f8fafc; border:0; border-inline-end:1px solid var(--line); cursor:pointer; font-family:inherit; }
  .day-tab:last-child { border-inline-end:0; }
  .day-tab .tab-title { display:block; font-size:12.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .day-tab .tab-date { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .day-tab.active { background:#e5e7eb; }
  .day-tab.active .tab-title, .day-tab.active .tab-date { color:#111827; }
  .day-list-box { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 10px; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  .day-list-box .empty { padding:14px; text-align:center; }
  @media (max-width:767px) {
    .day-tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .day-tab { min-width:96px; padding:8px 6px; }
    .day-tab .tab-title { font-size:11px; }
    .day-tab .tab-date { font-size:10px; }
    /* notification icon button: no white box on mobile */
    #notify-enable-btn { background:transparent; border:0; box-shadow:none; padding:4px 6px; }
  }

  /* ===== Mobile: prevent keyboard auto-zoom on inputs =====================
     Mobile browsers zoom into any focused input whose font size is below
     16px. 16px inputs = no zoom, so the page never jumps or stays zoomed. */
  @media (max-width:767px) {
    .controls input[type="search"], .controls select,
    .range-field input, #from-date, #to-date { font-size:16px; }
  }
  /* ===== Mobile: wide orders table scrolls within its own box ============ */
  @media (max-width:767px) {
    table.orders { display:block !important; overflow-x:auto !important; -webkit-overflow-scrolling:touch; white-space:nowrap; }
  }
  /* ===== Mobile header + controls polish ================================= */
  @media (max-width: 767px) {
    /* brand block centered on its own line */
    .topbar > div:first-child { width: 100%; text-align: center; }
    /* three equal columns: language | bell | hamburger (bell centered) */
    .toolbar-row { display: grid; grid-template-columns: 1fr 1fr 1fr; justify-items: center; }
    .toolbar-row .lang-btn, .toolbar-row #notify-enable-btn, .toolbar-row .hb-btn { width: auto; min-height: 40px; }
  }
  /* ===== WhatsApp button in View Order ====================================
     Desktop: TEXT ONLY (icon image hidden) so the action row stays compact
     and intact. Mobile: ICON ONLY. The desktop rule must live at TOP LEVEL —
     the previous nesting inside the max-width:767px block above could never
     match on desktop (nested media queries AND their conditions), which
     leaked the raw icon image onto desktop and broke the button row. */
  @media (min-width: 768px) {
    #detail-wa-btn img { display: none; }
    #detail-wa-btn { display: inline-flex; align-items: center; }
    .detail-actions { flex-wrap: wrap; }
  }
  @media (max-width: 767px) {
    /* mobile: WhatsApp ICON only — bigger, no container/background */
    #detail-wa-btn { background: transparent !important; border: 0 !important; padding: 0 !important; box-shadow: none !important; }
    #detail-wa-btn img { width: 44px !important; height: 44px !important; }
    #detail-wa-btn .wa-label { display: none !important; }
    .detail-actions { flex-wrap: wrap; }
  }
  /* ===== Three day sheets + From/To ====================================== */
  .range-group { display:inline-flex; align-items:center; gap:8px; margin-inline-start:12px; }
  .range-field { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted); }
  .range-field input { padding:6px 8px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .sheet-block { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  .sheet-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .sheet-title { font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#166534; }
  .sheet-date { font-size:12px; color:var(--muted); }
  .sheet-empty { font-size:12.5px; color:var(--muted); padding:6px 0; }
  .hb-btn { display:none; }
  #mobile-menu { display:none; }
  @media (max-width:767px) {
    #refresh-btn, #signout-btn, #push-enable-btn { display:none !important; }
    .hb-btn { display:inline-block; }
    #mobile-menu { display:block; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; }
    #mobile-menu[hidden] { display:none; }
    .mm-item { font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
    .mm-item:last-child { border-bottom:0; }
    .notify-txt { display:none; }
    .notify-ico { font-size:18px; }
    .controls { flex-wrap:wrap; gap:8px; }
    .range-group { flex-wrap:wrap; margin-inline-start:0; width:100%; }
    /* compact mobile order rows: Order Number | Status | View Order */
    table.orders th:nth-child(2), table.orders td:nth-child(2),
    table.orders th:nth-child(3), table.orders td:nth-child(3),
    table.orders th:nth-child(4), table.orders td:nth-child(4),
    table.orders th:nth-child(5), table.orders td:nth-child(5),
    table.orders th:nth-child(6), table.orders td:nth-child(6) { display:none; }
    table.orders th, table.orders td { padding:7px 8px; font-size:12.5px; }
    /* Status badge on mobile: long statuses like "Order Received" wrap onto
       two lines ("Order" / "Received") so the badge fits the compact row;
       short statuses like "Pending" still fit a single line. Pure layout —
       the status values themselves never change; desktop is untouched. */
    .badge { white-space: normal; max-width: 6em; text-align: center; line-height: 1.35; }
    .sheet-block { padding:10px 12px; }
    .section-title { font-size:15px; }
  }
  /* ===== Language toggle (EN | العربية) ================================== */
  .lang-btn .lang-sep { margin:0 6px; opacity:.5; }
  .lang-btn .lang-en, .lang-btn .lang-ar { opacity:.55; }
  .lang-btn .on { opacity:1; font-weight:800; }
  html[dir="rtl"] .order-toast { border-right:0; border-left:4px solid #25d366; }
  html[dir="rtl"] .detail-actions, html[dir="rtl"] .topbar, html[dir="rtl"] .pager { direction:rtl; }
  /* ===== New-order notifications (staff) ================================= */
  .notify-pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--muted); white-space:nowrap; }
  .notify-pill.on { color:#166534; background:#dcfce7; border-color:#86efac; }
  .notify-pill.warn { color:#92400e; background:#fef3c7; border-color:#fcd34d; }
  .notify-pill::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  /* Push status sentences (blocked/needs-HTTPS) can be long — wrap instead of
     overflowing the viewport on phones. */
  /* Brief attention pulse when staff tap the push control on a device where
     the browser blocks push, so the tap is never "dead". */
  @keyframes pill-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(146, 64, 14, 0); } 50% { box-shadow: 0 0 0 5px rgba(146, 64, 14, .3); } }
  .btn.pulse { animation: pill-pulse 1s ease-in-out 3; }
  /* ===== Mobile topbar: notification controls stay reachable and tappable ==
     The push/sound controls are NEVER hidden on mobile — they just take full
     rows with comfortable tap targets on small screens. RTL-neutral (flex
     row direction follows the document dir). */
  .toolbar-row {
    display: flex; align-items: center; justify-content: flex-end;
    width: 100%; gap: 12px; padding-top: 10px;
    border-top: 1px solid rgba(148, 163, 184, .25);
  }
  .toolbar-row .lang-btn, .toolbar-row #notify-enable-btn, .toolbar-row .hb-btn { margin: 0; }
  @media (max-width: 767px) {
    .toolbar-row { display: grid; grid-template-columns: 1fr 1fr 1fr; justify-items: center; padding-top: 8px; }
    /* icon-only notification toggle on mobile */
    #notify-enable-btn { background: transparent; border: 0; padding: 4px 8px; font-size: 18px; }
    #notify-enable-btn .notify-txt { display: none; }
  }
  #order-toasts { position:fixed; right:16px; bottom:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; max-width:min(92vw, 360px); }
  .order-toast { background:#111d27; color:#fff; border-radius:10px; padding:12px 14px; box-shadow:0 10px 30px rgba(15,23,42,.35); font-size:13.5px; line-height:1.45; border-right:4px solid #25d366; animation:toast-in .25s ease-out; }
  .order-toast strong { color:#7dd3fc; }
  @keyframes toast-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  /* ===== Detail view — embedded customer Order Sent sheet ================
     Staff "View Order" loads the real customer Order Sent page in a
     same-origin frame (see #order-sheet-frame below); the sheet keeps ALL of
     its own styles inside the frame — nothing is restyled or duplicated
     here. The frame itself just fills the width and sizes to its content.
     FOUC control: the frame carries .sheet-pending (invisible, zero height)
     from the moment navigation starts until the sheet is rendered AND the
     storefront chrome inside it is hidden — the customer page is therefore
     never painted; the area simply stays empty until the sheet is ready. */
  #order-sheet-frame { display:block; width:100%; border:0; background:transparent; }
  #order-sheet-frame.sheet-pending { visibility:hidden; }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff; }
    main { margin:0; max-width:none; padding:0; }
    /* Print Order prints the sheet INSIDE the frame (its own print styles);
       the parent page never needs to print this container. */
    #order-sheet-frame { display:none !important; }
  }
</style>
</head>
<body>
<header class="topbar no-print">
  <div>
    <div class="brand" data-i18n="brand">Store Orders</div>
    <div class="sub" data-i18n="sub">Store Orders Staff</div>
  </div>
  <span class="spacer"></span>
  <button class="btn" id="refresh-btn" type="button" data-i18n="refresh">Refresh</button>
  <button class="btn" id="signout-btn" type="button" data-i18n="signout">Sign Out</button>
  <!-- Web Push toggle: "Enable Push Notifications" before setup, then an
       ON/OFF toggle for this device's system notifications (see
       updatePushStatus / the click handler in the page script). -->
  <button class="btn" id="push-enable-btn" type="button" hidden>Enable Push Notifications</button>
  <div class="toolbar-row">
    <button class="btn lang-btn" id="lang-btn" type="button" title="Switch language"><span class="lang-en on">EN</span><span class="lang-sep">|</span><span class="lang-ar">العربية</span></button>
    <button class="btn" id="notify-enable-btn" type="button">Enable Notifications &amp; Sound</button>
    <button class="btn hb-btn" id="hb-btn" type="button" aria-label="Menu">☰</button>
  </div>
</header>
<div id="mobile-menu" class="no-print" hidden>
  <div class="mm-item" id="mm-push">⚠ Push notifications unavailable on this browser</div>
  <div class="mm-item"><button class="btn" id="signout-hb" type="button" data-i18n="signout">Sign Out</button></div>
</div>
<main>
  <div class="error-box" id="error-box" role="alert"></div>

  <!-- ===== List view ===== -->
  <section id="list-view">
    <h1 class="section-title">Orders</h1>
    <div class="controls no-print">
      <input type="search" id="search-box" placeholder="Search order number or customer name…" data-i18n-ph="searchPh" aria-label="Search orders"/>
      <button class="btn" id="search-btn" type="button" data-i18n="search">Search</button>
      <span class="range-group" id="range-group">
        <label class="range-field"><span data-i18n="from">From</span> <input type="date" id="from-date"/></label>
        <label class="range-field"><span data-i18n="to">To</span> <input type="date" id="to-date"/></label>
        <button class="btn" id="apply-range-btn" type="button" data-i18n="apply">Apply</button>
        <button class="btn" id="clear-range-btn" type="button" data-i18n="clearRange" style="display:none">Clear</button>
      </span>
    </div>
    <div class="day-tabs no-print" id="day-tabs"></div>
    <div class="day-list-box" id="day-list"></div>
    <div id="range-wrap" style="display:none">
      <table class="orders" id="orders-table">
        <thead>
          <tr>
            <th data-i18n="thOrderNo">Order #</th><th data-i18n="thDate">Date &amp; Time</th><th data-i18n="thCustomer">Customer</th><th data-i18n="thPhone">Phone</th>
            <th data-i18n="thLocation">Location</th><th class="r" data-i18n="thTotal">Total</th><th data-i18n="thStatus">Status</th><th></th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
      <div class="empty" id="empty-msg" style="display:none" data-i18n="rangeEmpty">No orders found for this range.</div>
    </div>
    <div class="pager no-print">
      <button class="btn" id="prev-btn" type="button" data-i18n="prev">← Prev</button>
      <span id="page-info"></span>
      <button class="btn" id="next-btn" type="button" data-i18n="next">Next →</button>
    </div>
  </section>

  <!-- ===== Detail view — the customer "Order Sent" sheet ==================
       Staff "View Order" embeds the EXISTING customer Order Sent page
       (order-detail.html through the signed /o/{id}-{signature} short link —
       the same mechanism the WhatsApp button already uses), so staff see the
       exact same sheet the customer sees: design, product images, stored
       names/prices/quantities, delivery info, POS note and watermark.
       Staff-only controls (Back / Print Order / Order Received) stay OUTSIDE
       the sheet in the bar above. -->
  <section id="detail-view" style="display:none">
    <div class="detail-actions no-print">
      <button class="btn" id="back-btn" type="button" data-i18n="back">← Back to Orders</button>
      <button class="btn primary" id="print-btn" type="button" data-i18n="print">🖨 Print Order</button>
      <button class="btn primary" id="order-received-btn" type="button" style="display:none;" data-i18n="orderReceived">Order Received</button>
      <button class="btn wa-btn" id="detail-wa-btn" type="button" style="display:none;" aria-label="Send WhatsApp Message">
        <img src="/topcar/whatsapp.png" alt="">
        <span class="wa-label">Send WhatsApp Message</span>
      </button>
    </div>
    <!-- The frame stays invisible (.sheet-pending) until the Order Sent sheet
         is rendered and dressed — the customer page is never painted, and the
         area is simply empty for the brief load. -->
    <iframe id="order-sheet-frame" class="sheet-pending" title="Order Sent" loading="eager"></iframe>
  </section>
</main>
<div id="order-toasts"></div>

<script>

  /* ===== Staff interface language (EN | العربية) ==========================
     UI-only: translates the Staff Orders INTERFACE. Customer-entered order
     data (names, phones, addresses, product names, codes, prices) is always

  function renderSheets(orders) {

    var db0 = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() - 2);

      if (key === dayKey(t0)) buckets.today.push(o);

      { key: "dayBefore", title: t("Day Before Yesterday", "dayBefore"), date: longDate(db0), bucket: buckets.dayBefore }

  /* ===== Detail view — the customer "Order Sent" sheet =====================

     see the EXACT sheet the customer sees after checkout: identical design,

     The frame is same-origin, which lets the staff page (without touching

     storefront chrome inside the frame is hidden (dressFrame). Nothing is
     shown in its place — detection-driven, no artificial delay. */

  // Order Sent sheet itself is left completely untouched.

    var f = document.getElementById("order-sheet-frame");
    var doc = frameDoc();
    if (!f || !doc || !doc.body || !doc.getElementById("order-detail-root")) return;
    [
      "body > nav",               // storefront header
      "body > footer",            // storefront footer
      "#mobile-bottom-nav",       // mobile tab bar
      "a[aria-label='WhatsApp']", // floating WhatsApp button
      "#toast-container",         // customer toasts
      "main .bg-indigo-50",       // customer confirm/cancel banner
      "main > .no-print"          // customer BACK TO HOME PAGE button
    ].forEach(function (sel) {
      Array.prototype.forEach.call(doc.querySelectorAll(sel), function (el) { el.style.display = "none"; });
    });

    if (m) { m.style.padding = "6px 0 12px"; m.style.minHeight = "0"; }
    doc.body.style.background = "transparent";
    doc.body.style.paddingBottom = "0";
    doc.documentElement.style.background = "transparent";

    if (pushPermissionDenied()) { updatePushStatus(); highlightPushStatus(); return; }
    pushBusy = true;
    var btn = document.getElementById("push-enable-btn");
    if (btn) btn.textContent = tt("Enabling…", "pushEnabling");
    // "default" = the staff has NEVER answered the browser prompt → ask now
    // (the browser's NATIVE prompt, from this click). "granted" = already
    // allowed → go straight to the subscription, no prompt. DEFAULT IS NOT
    // BLOCKED: only an explicit deny (or Chrome counting a dismissal as a
    // deny) can produce the blocked state.
    var perm = Notification.permission === "default" ? Notification.requestPermission() : Promise.resolve(Notification.permission);
    perm.then(function (result) {
        if (result !== "granted") { updatePushStatus(); return; } // denied → blocked message
        return subscribeDevice()
          .then(function () { setPushPausedLocally(false); updatePushStatus(); });
      })
      .catch(function () {})
      .then(function () { pushBusy = false; updatePushStatus(); });
  }
  // The push BUTTON: one control for setup AND on/off. Once subscribed it
  // reads 🔔 ON / 🔕 OFF and toggles THIS DEVICE's subscription — completely
  // independent of the Notifications & Sound toggle.
  var pushToggleBusy = false;
  document.getElementById("push-enable-btn").addEventListener("click", function () {
    // This click is a user gesture, so it also unlocks the chime (same as
    // the Notifications & Sound button).
    ensureAudio();
    var s = pushState();
    if (s === "on" || s === "paused") {
      // OFF pauses the subscription server-side (no system notifications;
      // the service worker and in-page alerts are untouched); ON resumes
      // for FUTURE orders only — pushes are event-driven, nothing replays.
      // The label flips only after the server confirms.
      if (pushToggleBusy) return;
      pushToggleBusy = true;
      var wantOn = s === "paused";
      syncPushPaused(wantOn).then(function (ok) {
        if (ok) setPushPausedLocally(!wantOn);
        pushToggleBusy = false;
        updatePushStatus();
      });
      return;
    }
    // not-set-up (the denied/insecure states explain themselves on the
    // button): first-time setup also turns the Notifications & Sound toggle
    // ON if no preference exists yet on this device.
    if (prefNotSet()) { setEnabled(true); updateStatus(); }
    enablePush();
  });
  // Staff may allow notifications in browser settings while this tab is in
  // the background — re-evaluate the push control when they come back.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) updatePushStatus();
  });
  // On load: warm up the service worker, heal the stored subscription (e.g.
  // after a server data reset) and re-apply this device's OWN push toggle
  // (healing re-enables the subscription server-side, so the paused choice
  // must be re-sent every load).
  function initPush() {
    if (!pushSupported()) { updatePushStatus(); return; }
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
    navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) {
        if (sub && Notification.permission === "granted") {
          saveSubServer(sub)
            .catch(function () {})
            .then(function () { syncPushPaused(!pushPausedLocally()); })
            .then(updatePushStatus);
        } else if (!sub) {
          // Browser lost the subscription (site data cleared / browser
          // reinstated it) — forget the flag so the Enable button returns.
          try { localStorage.removeItem(LS_PUSH_ENDPOINT); } catch (e) {}
          // Permission ALREADY granted but no subscription on this device:
          // never set up (or dropped). No prompt is needed — restore the
          // subscription automatically and show Push: On. The device's own
          // ON/OFF choice is preserved (the server re-save re-enables the
          // subscription, so the choice is re-applied right after).
          if (Notification.permission === "granted" && window.isSecureContext !== false) {
            subscribeDevice()
              .then(function () { return syncPushPaused(!pushPausedLocally()); })
              .catch(function () {})
              .then(updatePushStatus);
          } else {
            updatePushStatus();
          }
        } else {
          updatePushStatus();
        }
      })
      .catch(function () { updatePushStatus(); });
  }

  updateStatus();
  updatePushStatus();
  initPush();
  // Baseline first (silent), then poll for genuinely new orders.
  poll();
  window.__nassimPollNow = poll; // debug/manual trigger
  window.__nassimAudioState = function () { return audioCtx ? audioCtx.state : "none"; }; // debug/verification hook
  setInterval(poll, POLL_MS);
})();
</script>
</body>
